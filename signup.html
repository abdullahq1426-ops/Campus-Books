<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign Up | Campus Books</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="container header-content">
      <img src="assets/campus-books.svg" class="logo" width="220" height="42"
           usemap="#campus-map" alt="Campus Books">
      <map name="campus-map" id="campus-map">
        <area shape="rect" coords="0,0,220,42" href="about.html" alt="About Campus Books">
      </map>
      <nav class="menu" aria-label="Main navigation">
        <a href="index.html">Home</a>
        <a href="about.html">About Us</a>
        <a href="login.html">Log In</a>
        <a href="signup.html" aria-current="page">Sign Up</a>
      </nav>
    </div>
  </header>
  <main class="container">
    <section class="card account-card">
      <h1>Sign Up</h1>
      <p class="note">This page is a demonstration of the account form.</p>
      <form class="account-form" id="signup-form" method="post">
        <label for="signup-name">Full name</label>
        <input id="signup-name" name="fullName" type="text" autocomplete="name" required>
        <label for="signup-email">Email address</label>
        <input id="signup-email" name="email" type="email"
               autocomplete="email" required>
        <label for="signup-password">Password (at least 8 characters)</label>
        <input id="signup-password" name="password" type="password"
               minlength="8" autocomplete="new-password" required>
        <label for="signup-confirm">Confirm password</label>
        <input id="signup-confirm" name="confirmPassword" type="password"
               autocomplete="new-password" minlength="8" required>
        <button type="submit">Sign Up</button>
        <p class="form-status" role="status"></p>
      </form>
      <p>Already have an account? <a href="login.html">Log in</a>.</p>
    </section>
  </main>
  <footer>
    <p>Campus Books &middot; <span id="site-year">2026</span></p>
  </footer>
</body>
</html>
